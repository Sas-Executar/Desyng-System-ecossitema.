motion:
  duration:
    micro:
      $type: duration
      $value: 150ms
      $extensions:
        desyng.source: OBSERVED:ADR-SYSTEM.md(SPEC-MOTION-001 range 120-180ms)
    default:
      $type: duration
      $value: 200ms
      $extensions:
        desyng.source: OBSERVED:ADR-SYSTEM.md(range 180-250ms)
    large:
      $type: duration
      $value: 300ms
      $extensions:
        desyng.source: OBSERVED:ADR-SYSTEM.md(range 250-400ms)
  easing:
    out:
      $type: cubicBezier
      $value:
      - 0
      - 0
      - 0.2
      - 1
      $extensions:
        desyng.source: OBSERVED:ADR-SYSTEM.md(ease-out)
  allowed_properties:
